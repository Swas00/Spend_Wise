services:
  app:
    build: .
    container_name: spendwise-app
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/expense_tracker
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=spendwise_production_secret_key_change_me
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: spendwise-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
